name: SolutionBridge CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Train & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: solutionbridge
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/solutionbridge
        run: |
          python -m alembic upgrade head

      - name: Seed Database
        env:
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/solutionbridge
        run: |
          python scripts/seed_database.py

      - name: Train & Validate ML Pipelines
        run: |
          python -m ml.train_anomaly_model
          python -m ml.train_incident_classifier
          python -m ml.build_embeddings
          python -m ml.evaluate_models

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest tests/ -v --cov=app --cov=ml --cov-report=term-missing

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start FastAPI Background Server & Run Newman Tests
        env:
          DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/solutionbridge
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -f http://127.0.0.1:8000/health
          npx --yes newman run postman/SolutionBridge.postman_collection.json -e postman/SolutionBridge.postman_environment.json

      - name: Verify Docker Build
        run: |
          docker build -t solutionbridge:latest .
